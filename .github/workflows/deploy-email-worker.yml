name: 🚀 Build & Deploy Email Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      ############################################################
      # Checkout
      ############################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################################
      # Docker Buildx
      ############################################################

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      ############################################################
      # Docker Login
      ############################################################

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ############################################################
      # Docker Metadata
      ############################################################

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/aichee-email-worker
          tags: |
            type=raw,value=latest
            type=sha

      ############################################################
      # Build & Push
      ############################################################

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.email-worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      ############################################################
      # Deploy
      ############################################################

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            APP_DIR="$HOME/aichee-email-worker"

            echo "=================================="
            echo "Deploy Directory : $APP_DIR"
            echo "=================================="

            mkdir -p "$APP_DIR"

            ##################################################
            # Generate .env
            ##################################################

            cat > "$APP_DIR/.env" <<'EOF'
            APP_BASE_URL=${{ secrets.APP_BASE_URL }}

            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DB_CONNECTION_LIMIT=${{ secrets.DB_CONNECTION_LIMIT }}

            REDIS_URL=${{ secrets.REDIS_URL }}

            EMAIL_SMTP_USER=${{ secrets.EMAIL_SMTP_USER }}
            EMAIL_SMTP_APP_PASSWORD=${{ secrets.EMAIL_SMTP_APP_PASSWORD }}
            EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}
            EMAIL_FROM_NAME=${{ secrets.EMAIL_FROM_NAME }}
            EMAIL_WORKER_CONCURRENCY=${{ secrets.EMAIL_WORKER_CONCURRENCY }}

            NODE_ENV=production
            EOF

            chmod 600 "$APP_DIR/.env"

            echo "✅ .env created"

            ##################################################
            # Run Deployment
            ##################################################

            chmod +x "$APP_DIR/deploy.sh"

            "$APP_DIR/deploy.sh"

            ##################################################
            # Wait for Container
            ##################################################

            echo ""
            echo "Waiting for container..."

            sleep 10

            if [ "$(docker inspect -f '{{.State.Running}}' aichee-email-worker)" != "true" ]; then
              echo "❌ Container crashed."

              docker logs aichee-email-worker

              exit 1
            fi

            ##################################################
            # Health Check (Worker Queue Connection)
            ##################################################

            echo ""
            echo "Checking worker status..."

            READY=0

            for i in $(seq 1 15)
            do
              if docker logs aichee-email-worker 2>&1 | grep -q "listening on"
              then
                READY=1
                break
              fi

              if [ "$(docker inspect -f '{{.State.Running}}' aichee-email-worker)" != "true" ]; then
                echo "❌ Worker exited unexpectedly."
                docker logs aichee-email-worker
                exit 1
              fi

              echo "Retry $i / 15"
              sleep 3
            done

            if [ "$READY" -eq 1 ]; then
              echo "✅ Email Worker Deployment Successful"
              docker logs --tail 20 aichee-email-worker
            else
              echo "⚠️ Worker is running, logs:"
              docker logs --tail 25 aichee-email-worker
            fi
